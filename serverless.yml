service: sentiment-analyzer

provider:
  name: aws
  runtime: python3.9
  region: ap-south-1

functions:
  app:
    handler: wsgi_handler.handler
    events:
      - http:
          path: /
          method: GET
      - http:
          path: /analyze/{input_txt}
          method: GET
          request:
            parameters:
              paths:
                input_txt: true


plugins:
  - serverless-wsgi
  - serverless-python-requirements
  - serverless-prune-plugin

custom:
  wsgi:
    app: app.app 
  pythonRequirements:
    dockerizePip: false
  prune:
    automatic: true  
    number: 2  
    
package: 
  patterns:
    - '!venv/**'
    - '!__pycache__/**'
    - '!node_modules/**'
    - '!.serverless/**'
    - '!package-lock.json'
